<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account — RentalWebsite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --darkest:#051F20;--dark:#0B2B26;--primary:#235347;
            --sage:#8EB69B;--mint:#DAF1DE;--white:#ffffff;
            --border:#c8e2cf;--light:#f0f9f2;--muted:#5a7a6e;
        }
        body{
            font-family:'Inter',system-ui,sans-serif;min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            position:relative;overflow-x:hidden;padding:24px 16px;
            -webkit-font-smoothing:antialiased;
        }
        .bg{position:fixed;inset:0;z-index:0}
        .bg img{width:100%;height:100%;object-fit:cover;}
        .bg-overlay{position:absolute;inset:0;background:rgba(0,0,0,.32)}
        .brand{position:fixed;top:26px;left:36px;z-index:10;font-size:17px;font-weight:800;color:#fff;letter-spacing:-.03em;text-decoration:none}
        .tagline{position:fixed;bottom:28px;left:36px;z-index:10;font-size:13px;color:rgba(255,255,255,.75)}

        /* Back-to-home button — page level, outside the card */
        .home-btn{position:fixed;top:22px;right:36px;z-index:10;
                  display:inline-flex;align-items:center;gap:8px;
                  background:rgba(255,255,255,.14);
                  border:1.5px solid rgba(255,255,255,.35);
                  color:#fff;font-size:13px;font-weight:600;
                  font-family:'Inter',sans-serif;letter-spacing:-.01em;
                  padding:9px 16px;border-radius:999px;cursor:pointer;
                  text-decoration:none;backdrop-filter:blur(8px);
                  -webkit-backdrop-filter:blur(8px);
                  transition:background .15s,border-color .15s}
        .home-btn:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.6)}
        .home-btn svg{flex-shrink:0}

        .card{
            position:relative;z-index:10;background:var(--white);
            border-radius:20px;padding:38px 44px;width:100%;max-width:480px;
            box-shadow:0 28px 80px rgba(5,31,32,.4);border:1.5px solid var(--border);
        }
        h1{font-size:22px;font-weight:800;color:var(--darkest);letter-spacing:-.04em;margin-bottom:6px}
        .sub{font-size:13px;color:var(--muted);margin-bottom:22px}
        .sub a{color:var(--primary);font-weight:700;text-decoration:underline;
               display:inline-block;padding:10px 4px;margin:-10px -4px}

        .field{margin-bottom:14px}

        label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
        input[type="email"],input[type="password"],input[type="text"],input[type="tel"]{
            width:100%;background:var(--light);border:1.5px solid var(--border);border-radius:7px;
            padding:11px 13px;font-size:16px;font-family:'Inter',sans-serif;color:var(--darkest);
            min-height:48px;
            outline:none;transition:border-color .15s,box-shadow .15s;
        }
        input::placeholder{color:var(--muted);opacity:.85}
        input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(35,83,71,.1)}

        .pw-wrap{position:relative}
        .pw-wrap input{padding-right:52px}
        .pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;min-width:44px;min-height:44px;padding:12px}
        .pw-toggle:hover{color:var(--primary)}

        .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
        .pw-strength{height:3px;border-radius:2px;margin-top:5px;background:transparent;transition:all .3s}
        .pw-strength.weak  {background:#ef4444;width:30%}
        .pw-strength.fair  {background:#f59e0b;width:65%}
        .pw-strength.strong{background:#22c55e;width:100%}

        .terms-row{display:flex;align-items:flex-start;gap:9px;margin:14px 0 18px}
        .terms-row input[type="checkbox"]{
            width:15px;height:15px;border:1.5px solid var(--border);border-radius:3px;
            background:var(--light);cursor:pointer;appearance:none;-webkit-appearance:none;
            position:relative;flex-shrink:0;margin-top:1px;
            transition:border-color .15s,background .15s;
        }
        .terms-row input:checked{background:var(--primary);border-color:var(--primary)}
        .terms-row input:checked::after{content:'';position:absolute;left:3px;top:0;width:7px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg)}
        .terms-row label{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;margin:0;cursor:pointer;line-height:1.55}
        .terms-row a{color:var(--primary);text-decoration:underline}

        .btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:background .15s;letter-spacing:-.01em}
        .btn:hover{background:#163832}

        /* Google button */
        .or-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--sage);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
        .or-divider::before,.or-divider::after{content:'';flex:1;height:1.5px;background:var(--border)}
        .g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f2937;border:1.5px solid var(--border);border-radius:8px;padding:12px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;text-decoration:none;transition:border-color .15s,box-shadow .15s}
        .g-btn:hover{border-color:var(--primary);box-shadow:0 1px 4px rgba(5,31,32,.08)}
        .g-btn svg{flex-shrink:0}
        .g-note{font-size:11px;color:var(--sage);text-align:center;margin-top:8px;line-height:1.5}

        .alert{padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:14px;line-height:1.5}
        .alert-danger {background:#fef2f2;border:1.5px solid #fecaca;color:#991b1b}
        .alert-success{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#166534}
        .alert ul{margin:5px 0 0;padding-left:16px}
        .alert li{margin-bottom:2px}

        .note{font-size:11px;color:var(--sage);text-align:center;margin-top:14px;line-height:1.6}
        .note a{color:var(--primary);text-decoration:underline}
        @media(max-width:480px){.card{padding:28px 20px}.brand,.tagline{display:none}.home-btn{top:16px;right:16px}}
    </style>
</head>
<body>

<div class="bg">
    <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1600&q=80&auto=format&fit=crop" alt="">
    <div class="bg-overlay"></div>
</div>
<a href="http://localhost/rental_website/public" class="brand">RentalWebsite</a>
<p class="tagline">See it. Understand it. Then decide.</p>

<a href="http://localhost/rental_website/public" class="home-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    Back to home
</a>

<div class="card">
    <h1>Create account</h1>
    <p class="sub">Already have an account? <a href="http://localhost/rental_website/public/auth/login">Sign in</a></p>

    
    
        <a href="http://localhost/rental_website/public/auth/google" class="g-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4" fill-rule="evenodd"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853" fill-rule="evenodd"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05" fill-rule="evenodd"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335" fill-rule="evenodd"/></svg>
        Continue with Google
    </a>
    <div class="or-divider"><span>or sign up with email</span></div>
    
        <form method="POST" action="http://localhost/rental_website/public/auth/register" novalidate>
        <input type="hidden" name="_csrf_token" value="5b6af706189b7c37811115d22936331f05f11baac1ce54a9ae4a7ca796bdb37d">

        <div class="field">
            <label for="full_name">Full name</label>
            <input type="text" id="full_name" name="full_name" placeholder="John Doe" required maxlength="160"
                   autocomplete="name"
                   value="">
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com"
                   required autocomplete="email"
                   value="">
        </div>

        <div class="field" style="margin-bottom:0">
            <label for="password">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" name="password"
                       placeholder="Create a password"
                       required minlength="8" autocomplete="new-password"
                       oninput="checkStrength(this)">
                <button type="button" class="pw-toggle" onclick="togglePw('password',this)">Show</button>
            </div>
            <div class="pw-strength" id="pwStrength"></div>
            <p class="hint">At least 8 characters, with 1 uppercase letter and 1 number.</p>
        </div>

        <div class="terms-row">
            <input type="checkbox" id="agree" name="agree_terms" value="1" required>
            <label for="agree">
                I agree to the
                <a href="http://localhost/rental_website/public/page/terms" target="_blank">Terms</a> &amp;
                <a href="http://localhost/rental_website/public/page/privacy" target="_blank">Privacy Policy</a>
            </label>
        </div>

        <button type="submit" class="btn">Create account &rarr;</button>
    </form>

    <p class="note">&copy; 2026 RentalWebsite &middot; <a href="http://localhost/rental_website/public/page/privacy">Privacy</a></p>
</div>

<script>
function togglePw(id,btn){var i=document.getElementById(id);if(!i)return;var h=i.type==='password';i.type=h?'text':'password';btn.textContent=h?'Hide':'Show';}
function checkStrength(input){
    var bar=document.getElementById('pwStrength');if(!bar)return;
    var v=input.value,score=0;
    if(v.length>=8)score++;if(/[A-Z]/.test(v))score++;if(/[0-9]/.test(v))score++;if(/[^A-Za-z0-9]/.test(v))score++;
    bar.className='pw-strength';if(!v.length)return;
    if(score<=1)bar.classList.add('weak');else if(score<=2)bar.classList.add('fair');else bar.classList.add('strong');
}
</script>
</body>
</html>
